# Tiempo de asignación exigido: 5 minutos (300 segundos)
default-lease-time 300;
max-lease-time 300;

# El servidor es autoritativo para esta red
authoritative;

# Configuración de la subred LT
subnet 172.16.108.0 netmask 255.255.252.0 {
    # Rango de IPs dinámicas para HT1, HT2 y HT3
    range 172.16.108.10 172.16.108.30;
    
    # Puerta de enlace (IP de eth0 en RT)
    option routers 172.16.111.254;
    
    # Servidor DNS de la empresa (asumiendo que lo pondremos en HC1)
    option domain-name-servers 172.16.64.1;
    option domain-name "empresa.izo";
}
host ht4{
	hardware ethernet 00:00:00:00:00:04;
	fixed-address 172.16.108.40;
}
host ht5{
	hardware ethernet 00:00:00:00:00:05;
	fixed-address 172.16.108.50;
}
